<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="整理目前仍可領取的限時免費遊戲，追蹤自己的領取狀態。">
  <title>限時免費遊戲 · CHI</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/47tsai/chi-design-system/main/logo/blue-w.png">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/47tsai/chi-design-system/main/logo/blue-w.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/47tsai/chi-design-system@main/tokens.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/47tsai/chi-design-system@main/components.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/47tsai/chi-design-system@main/navigation.css">
  <link rel="stylesheet" href="./app.css">
  <script src="./config.js"></script>
  <script src="./app.js" defer></script>
</head>
<body class="chi-page">
  <a class="chi-skip-link" href="#main-content">跳至主要內容</a>
  <header class="site-header">
    <div class="chi-container site-header__inner">
      <a class="site-brand" href="./" aria-label="Free Games 首頁">
        <span class="brand-mark" aria-hidden="true">
          <img class="brand-logo-light" src="https://raw.githubusercontent.com/47tsai/chi-design-system/main/logo/blue-b.png" alt="">
          <img class="brand-logo-dark" src="https://raw.githubusercontent.com/47tsai/chi-design-system/main/logo/blue-w.png" alt="">
        </span>
        <span>Free Games<small>FREE GAME TRACKER</small></span>
      </a>
      <nav class="site-nav" id="site-nav" aria-label="主要導覽">
        <a href="#games" aria-current="page">限免清單</a>
        <a href="https://status.chi.qzz.io/">Chi Status</a>
        <a href="https://github.com/47tsai/free-game" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
      <div class="site-tools">
        <button class="site-button" id="theme-toggle" type="button" aria-label="切換色彩模式" title="切換色彩模式">
          <svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="https://cdn.jsdelivr.net/gh/47tsai/chi-design-system@main/icons.svg#moon"></use></svg>
        </button>
        <button class="site-button auth-button" id="login-button" type="button">使用 CHIAuth 登入</button>
        <button class="site-button auth-button" id="logout-button" type="button" hidden>登出</button>
        <button class="site-button menu-button" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="開啟導覽選單">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="chi-template-main" id="main-content" tabindex="-1">
    <section class="chi-container page-intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">FREE GAME TRACKER</p>
        <h1 class="chi-title" id="page-title">限時免費遊戲</h1>
        <p class="chi-description">集中整理仍在領取期限內的免費遊戲。登入後可同步個人領取狀態，隨時掌握還沒入庫的作品。</p>
      </div>
      <div class="summary" aria-label="活動摘要" aria-live="polite">
        <div><strong id="total-count">—</strong><span>進行中活動</span></div>
        <div><strong id="unclaimed-count">—</strong><span>尚未領取</span></div>
      </div>
    </section>

    <section class="chi-container workspace" id="games" aria-label="限時免費遊戲清單">
      <div class="toolbar">
        <label class="search-field">
          <span class="sr-only">搜尋遊戲</span>
          <svg class="chi-icon" aria-hidden="true" focusable="false"><use href="https://cdn.jsdelivr.net/gh/47tsai/chi-design-system@main/icons.svg#search"></use></svg>
          <input id="search-input" type="search" placeholder="搜尋遊戲名稱" autocomplete="off">
        </label>
        <div class="filters" role="group" aria-label="領取狀態篩選">
          <button class="filter-button is-active" data-filter="all" type="button" aria-pressed="true">全部</button>
          <button class="filter-button" data-filter="unclaimed" type="button" aria-pressed="false">尚未領取</button>
          <button class="filter-button" data-filter="claimed" type="button" aria-pressed="false">已領取</button>
        </div>
        <label class="platform-select">
          <span class="sr-only">平台</span>
          <select id="platform-filter">
            <option value="all">所有平台</option>
            <option value="Epic Games Store">Epic Games Store</option>
            <option value="Steam">Steam</option>
            <option value="GOG">GOG</option>
            <option value="Ubisoft">Ubisoft</option>
            <option value="DLsite">DLsite</option>
          </select>
        </label>
      </div>

      <div class="result-meta">
        <span id="result-count" aria-live="polite">載入中…</span>
        <button class="text-button" id="refresh-button" type="button">重新整理</button>
      </div>

      <div id="game-list" class="game-list" aria-live="polite">
        <div class="loading-state">正在載入限免清單…</div>
      </div>
      <div id="empty-state" class="empty-state" hidden>
        <h2>目前沒有符合條件的遊戲</h2>
        <p>調整搜尋條件，或等候下一批限免活動更新。</p>
      </div>
      <p class="data-note" id="updated-at"></p>
      <div class="error-message" id="error-message" role="alert" hidden></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="chi-container site-footer__inner">
      <span>CHI · Free Game Tracker</span>
      <span><a href="https://status.chi.qzz.io/">Chi Status</a>　·　<a href="https://github.com/47tsai/free-game" target="_blank" rel="noopener noreferrer">GitHub 專案</a></span>
    </div>
  </footer>
</body>
</html>
