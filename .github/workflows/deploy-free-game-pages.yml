name: Deploy Free Game Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-free-game-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Cloudflare DNS permissions and current records
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: 24c702da27c90f0da38e9f80c0bbe58e
        run: |
          set -euo pipefail
          echo "=== DNS records ==="
          dns=$(curl -fsS -G "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            --data-urlencode "name=fg.chi.qzz.io")
          echo "$dns" | jq -c '.result[] | {id,type,name,content,proxied,ttl}'
          echo "=== Pages custom domains ==="
          domains=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/free-game/domains" \
            -H "Authorization: Bearer $CF_API_TOKEN")
          echo "$domains" | jq -c '.result[] | {id,name,status,verification_status:.verification_data.status}'
