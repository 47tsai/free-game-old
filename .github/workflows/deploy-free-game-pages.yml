name: Deploy Free Game Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-free-game-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Inspect Cloudflare domain configuration
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: 24c702da27c90f0da38e9f80c0bbe58e
        run: |
          set -euo pipefail
          echo "Pages project domain bindings:"
          curl -fsS -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/free-game/domains" |
            jq '{success, errors, result: [.result[]? | {id, name, status, verification_data: {status: .verification_data.status, method: .verification_data.method}}]}'
          echo "DNS records for fg.chi.qzz.io:"
          curl -fsS -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=fg.chi.qzz.io" |
            jq '{success, errors, result: [.result[]? | {id, type, name, content, proxied, ttl}]}'
