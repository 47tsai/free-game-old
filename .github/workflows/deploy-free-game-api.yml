name: Deploy Free Game API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FREE_GAME_GH_TOKEN: ${{ secrets.FREE_GAME_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FREE_GAME_GH_TOKEN"
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Set Worker GitHub token secret
        working-directory: worker
        run: printf '%s' "$FREE_GAME_GH_TOKEN" | wrangler secret put FREE_GAME_GH_TOKEN --config wrangler.toml
      - name: Deploy Worker
        working-directory: worker
        run: wrangler deploy --config wrangler.toml
